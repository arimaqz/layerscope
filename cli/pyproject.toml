[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "layerscope-cli"
version = "1.0.0"
description = "Non-interactive LayerScope API client for CI/CD automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
layerscope = "layerscope_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
