limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=12r/m;
limit_conn_zone $binary_remote_addr zone=connections_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  client_max_body_size 1m;
  client_body_timeout 60s;
  send_timeout 300s;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 120s;
  open_file_cache_min_uses 2;

  # Nginx owns browser policy headers; suppress equivalent upstream values so
  # each policy is emitted exactly once on proxied API responses.
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header X-Frame-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header Permissions-Policy;
  proxy_hide_header Server;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'; media-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Origin-Agent-Cluster "?1" always;

  location ^~ /api/auth/ {
    limit_req zone=auth_per_ip burst=8 nodelay;
    limit_conn connections_per_ip 5;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/events {
    limit_conn connections_per_ip 5;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 60s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/uploads {
    client_max_body_size 41g;
    limit_req zone=api_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 3;
    client_body_timeout 3600s;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/backups/import {
    access_log off;
    client_max_body_size 100g;
    limit_req zone=api_per_ip burst=5 nodelay;
    limit_conn connections_per_ip 2;
    client_body_timeout 3600s;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/reports/import {
    access_log off;
    client_max_body_size 64m;
    limit_req zone=api_per_ip burst=5 nodelay;
    limit_conn connections_per_ip 2;
    client_body_timeout 300s;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /api/exports/branded {
    client_max_body_size 2m;
    limit_req zone=api_per_ip burst=10 nodelay;
    limit_conn connections_per_ip 3;
    client_body_timeout 60s;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location ^~ /api/backups/ {
    access_log off;
    limit_req zone=api_per_ip burst=5 nodelay;
    limit_conn connections_per_ip 3;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Stream potentially large evidence and image downloads directly. Ordinary
  # JSON APIs below still benefit from small in-memory response buffers.
  location ~ ^/api/(images/[0-9]+/archive|scans/[0-9]+/raw|exports)$ {
    limit_req zone=api_per_ip burst=20 nodelay;
    limit_conn connections_per_ip 5;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /api/ {
    limit_req zone=api_per_ip burst=60 nodelay;
    limit_conn connections_per_ip 20;
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_buffering on;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_max_temp_file_size 0;
    proxy_cache off;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Connection '';
    proxy_set_header Host backend;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location ~ /\. {
    deny all;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
